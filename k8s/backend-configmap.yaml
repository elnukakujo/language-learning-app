apiVersion: v1
kind: ConfigMap
metadata:
  name: fluence-backend-config
  namespace: fluence
data:
  LAPP_ENV: "prod"
  LAPP_HOST: "0.0.0.0"
  LAPP_PORT: "5000"
  LAPP_DEVICE: "cpu"
  LAPP_SKIP_STARTUP_TASKS: "true"
  PROD_MEDIA_ROOT: "/app/media"
  PROD_BACKUP_ROOT: "/app/backups"
  # Bootstrap-only: restores the latest backup on first start after cutover.
  # Flip to "false" after the first successful deploy so routine restarts
  # don't clobber recent data with an old dump.
  RESTORE_LATEST_BACKUP: "true"
