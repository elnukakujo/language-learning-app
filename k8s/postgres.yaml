# PV path must match the real directory backing the docker-compose "pgdata" volume
# on PCT — find it with: docker volume inspect <project>_pgdata
apiVersion: v1
kind: PersistentVolume
metadata:
  name: fluence-pgdata-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /var/lib/docker/volumes/language-learning-app_pgdata/_data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fluence-pgdata-pvc
  namespace: fluence
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  volumeName: fluence-pgdata-pv
  storageClassName: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: fluence
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: fluence_app
            - name: POSTGRES_DB
              value: fluence
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fluence-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fluence_app", "-d", "fluence"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: fluence-pgdata-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fluence
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
