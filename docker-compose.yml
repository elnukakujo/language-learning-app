services:
  db:
    image: postgres:16
    container_name: fluence-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fluence_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fluence_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-fluence}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fluence_app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      LAPP_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-fluence_app}:${POSTGRES_PASSWORD:-fluence_dev_pass}@db:5432/${POSTGRES_DB:-fluence}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${LAPP_PORT:-5000}:${LAPP_PORT:-5000}"
    volumes:
      - ${PROD_MEDIA_ROOT:-./media}:/app/media
      - ${PROD_BACKUP_ROOT:-./backups}:/app/backups

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        LAPP_PUBLIC_HOST: ${LAPP_PUBLIC_HOST:-localhost}
        LAPP_PUBLIC_PORT: ${LAPP_PORT:-5000}
    environment:
      PORT: 3000
    depends_on:
      - backend
    ports:
      - "${PORT:-8080}:3000"

volumes:
  pgdata:
